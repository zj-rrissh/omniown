[package]
name = "omniown-desktop"
version = "0.1.0"
edition = "2021"
description = "OmniOwn 桌面端 — Tauri v1 壳"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "1", features = [ "macos-private-api", "shell-sidecar", "system-tray"] }
tauri-plugin-positioner = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "1", features = [] }
