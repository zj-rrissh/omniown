name: Release

# 触发: 推送 v* 标签 或 手动
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── 构建 sidecar (omniown) 三个平台 ──
  build-sidecar:
    name: sidecar-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build sidecar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/omniown${{ matrix.ext }}

  # ── 构建 Tauri 桌面应用 三个平台 ──
  build-tauri:
    name: tauri-${{ matrix.target }}
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            sidecar-target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            sidecar-target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            sidecar-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 系统依赖
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev pkg-config

      # 下载 sidecar 二进制
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-${{ matrix.sidecar-target }}
          path: src-tauri/binaries/

      - name: Rename sidecar
        shell: bash
        run: |
          mv src-tauri/binaries/omniown${{ matrix.ext }} \
             src-tauri/binaries/omniown-${{ matrix.sidecar-target }}${{ matrix.ext }}
          chmod +x src-tauri/binaries/omniown-${{ matrix.sidecar-target }}${{ matrix.ext }}

      # 构建 Vue 前端
      - name: Build UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # Tauri 打包
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OmniOwn ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
