---
name: Release

permissions:
  contents: write
  pull-requests: write
# 触发: 推送 v* 标签 或 手动
"on":
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── 构建 sidecar (omniown) ── 当前仅 Windows
  build-sidecar:
    name: sidecar-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: ubuntu-24.04
          #   target: x86_64-unknown-linux-gnu
          #   ext: ''
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   ext: ''
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build sidecar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/omniown${{ matrix.ext }}

  # ── 构建 Tauri 桌面应用 ── 当前仅 Windows
  build-tauri:
    name: tauri-${{ matrix.target }}
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: ubuntu-24.04
          #   target: x86_64-unknown-linux-gnu
          #   ext: ''
          #   sidecar-target: x86_64-unknown-linux-gnu
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          #   ext: ''
          #   sidecar-target: aarch64-apple-darwin
          # - os: macos-15-intel
          #   target: x86_64-apple-darwin
          #   ext: ''
          #   sidecar-target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            sidecar-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare bundled Node runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = Invoke-RestMethod 'https://nodejs.org/dist/index.json'
          $release = @($releases) |
            Where-Object { $_.version -like 'v24.*' -and $_.files -contains 'win-x64-zip' } |
            Select-Object -First 1
          if (-not $release) {
            throw 'Unable to locate latest Node.js v24 release'
          }

          $version = $release.version
          $zipName = "node-$version-win-x64.zip"
          $url = "https://nodejs.org/dist/$version/$zipName"
          Write-Host "Bundling Node.js $version from $url"
          $downloadPath = Join-Path $PWD $zipName
          $extractPath = Join-Path $PWD 'node-runtime'
          $targetPath = Join-Path $PWD 'src-tauri/resources/node/win-x64'

          Invoke-WebRequest -Uri $url -OutFile $downloadPath
          Expand-Archive -Path $downloadPath -DestinationPath $extractPath -Force

          $nodeRoot = Get-ChildItem -Path $extractPath -Directory -Filter 'node-v*-win-x64' |
            Select-Object -First 1
          if (-not $nodeRoot) {
            throw 'Extracted Node.js runtime directory not found'
          }

          New-Item -ItemType Directory -Force -Path $targetPath | Out-Null
          Copy-Item -Path (Join-Path $nodeRoot.FullName 'node.exe') -Destination (Join-Path $targetPath 'node.exe') -Force
          Copy-Item -Path (Join-Path $nodeRoot.FullName 'LICENSE') -Destination (Join-Path $targetPath 'LICENSE') -Force

          & (Join-Path $targetPath 'node.exe') --version
          Get-ChildItem -Path $targetPath

      # 系统依赖 (Tauri v1 需要 WebKitGTK 4.0)
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # 下载 sidecar 二进制
      - name: Download sidecar
        uses: actions/download-artifact@v8
        with:
          name: sidecar-${{ matrix.sidecar-target }}
          path: src-tauri/binaries/

      - name: Rename sidecar
        shell: bash
        run: |
          SIDECAR=$(find src-tauri/binaries -type f -name "omniown${{ matrix.ext }}" | head -n 1)
          if [ -z "$SIDECAR" ]; then
            echo "ERROR: sidecar not found in src-tauri/binaries/"
            find src-tauri/binaries -type f
            exit 1
          fi

          mv "$SIDECAR" \
            "src-tauri/binaries/omniown-${{ matrix.sidecar-target }}${{ matrix.ext }}"

          if [ "${{ runner.os }}" != "Windows" ]; then
            chmod +x \
              "src-tauri/binaries/omniown-${{ matrix.sidecar-target }}${{ matrix.ext }}"
          fi

          echo "==== binaries ===="
          ls -lah src-tauri/binaries

          echo "==== binaries ===="
          find src-tauri/binaries -type f

      # 构建 Node.js 服务端
      - name: Build Server
        run: |
          npm --prefix server ci
          npm --prefix server run build

      # 构建 Vue 前端
      - name: Build UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      # CI 中 server + ui 已构建，将 beforeBuildCommand 替换为 no-op
      - name: Skip beforeBuildCommand in CI
        shell: bash
        run: |
          python3 -c "import json; c=json.load(open('src-tauri/tauri.conf.json')); c['build']['beforeBuildCommand']='true'; json.dump(c, open('src-tauri/tauri.conf.json','w'), indent=2)"

      # Tauri 打包
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: OmniOwn ${{ github.ref_name }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          projectPath: src-tauri
