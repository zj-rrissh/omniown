[package]
name = "omniown"
version = "0.1.0"
edition = "2024"

[features]
default = []

[dependencies]
anyhow = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "0.8"

# PDF / Office document parsing
lopdf = "0.34"
calamine = "0.26"
zip = "2"
quick-xml = "0.36"
