# OmniOwn 配置模板
# 复制此文件为 omniown.toml 并填写 api_key 等设置
#
# 使用方式:
#   cp omniown.example.toml omniown.toml
#   编辑 omniown.toml

# ── 存储路径 ──────────────────────────────────────────────
[paths]
# 数据根目录（所有相对路径的基础，默认 "."）
# root = "."

# 知识库目录 — 文件放入即自动索引（默认 "./library"）
# 支持绝对路径：library = "/home/user/knowledge-base"
# library = "library"

# ── AI 搜索 ───────────────────────────────────────────────
[ai]
# AI 驱动的自然语言搜索（两阶段管线）
#
# API 基础地址（兼容 OpenAI 接口规范）
# OpenAI:   https://api.openai.com/v1
# DeepSeek: https://api.deepseek.com
# Ollama:   http://localhost:11434/v1
# base_url = "https://api.deepseek.com"
#
# 模型名
# DeepSeek: deepseek-v4-flash
# OpenAI:   gpt-4o-mini
# model = "deepseek-v4-flash"
#
# API 密钥（必填）
# DeepSeek: 在 https://platform.deepseek.com/api_keys 创建
# OpenAI:   在 https://platform.openai.com/api-keys 创建
# Ollama:   留空即可（本地服务不需要密钥）
api_key = "YOUR_API_KEY_HERE"
#
# Prompt 版本（可选，"v1" 或 "v2"）
# v1 — 基础策略选择（默认）
# v2 — Few-shot 示例 + 文档库统计上下文注入
# prompt_variant = "v1"
